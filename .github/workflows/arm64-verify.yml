name: arm64-verify-acceptance

# ROADMAP ㉝ 遗留 1 的实机验收：arm64 verify worker 执行路径
# （RWX 映射 + 执行 + arm64 SSO/桩解码全链）。
#
# GitHub macos-15 runner = arm64。AMFI 默认拒绝 unsigned executable
# memory，但 runner SIP 关闭 → 可对 wxkeep 临时 ad-hoc 重签
# allow-unsigned-executable-memory entitlement，让 worker 的 RWX mmap
# 合法（用户的真机则是 amfi_get_out_of_my_way 引导，两条路同一验收）。
#
# 两级验收：
#   1) 合成镜像行为测试（swift test --filter VerifierTests）——探针门后
#      自动放行；环境拒绝则优雅 skip，不红
#   2) 真件端到端（CDN dmg → fake app → `wxkeep verify` arm64 分支全链：
#      fat lipo → catalog 定位 → MachImage 谓词反解 → worker → verdict）
#
# 手动触发（push 后跑一次即完成验收里程碑；~400MB 下载，不挂 push）。

on:
  workflow_dispatch:
    inputs:
      build:
        description: "构建号（catalog 收录且有 CDN 归档；默认 270100）"
        default: "270100"
        required: false

jobs:
  arm64-verify:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show toolchain
        run: |
          swift --version
          uname -m
          csrutil status || true
      - name: Build (debug for tests + release for CLI acceptance)
        run: |
          swift build
          swift build -c release
      - name: Entitle binaries (unsigned executable memory for the worker)
        run: |
          cat > /tmp/wxkeep-exec.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
          </dict>
          </plist>
          EOF
          codesign --force --sign - --entitlements /tmp/wxkeep-exec.plist .build/debug/wxkeep
          codesign --force --sign - --entitlements /tmp/wxkeep-exec.plist .build/release/wxkeep
          codesign -dv .build/release/wxkeep 2>&1 | sed -n '1,6p'
      - name: Environment probe (can the worker mmap RWX here?)
        id: rwx
        run: |
          mkdir -p /tmp/wxprobe
          python3 - <<'PY'
          data = bytearray(0x100)
          data[0:4] = b'\xc0\x03\x5f\xd6'   # arm64 ret
          open('/tmp/wxprobe/probe.bin', 'wb').write(bytes(data))
          PY
          set +e
          .build/release/wxkeep __verify-worker /tmp/wxprobe/probe.bin 0 '{}' '[]' '[["x","1"]]'
          st=$?
          set -e
          echo "probe exit: $st"
          if [ "$st" -eq 0 ]; then
            echo "rwx=ok" >> "$GITHUB_OUTPUT"
            echo "RWX-EXEC: OK — entitlement route works on this runner"
          elif [ "$st" -eq 126 ] || [ "$st" -eq 137 ]; then
            echo "rwx=blocked" >> "$GITHUB_OUTPUT"
            echo "::warning::RWX-EXEC BLOCKED (exit $st) — AMFI refuses even entitled; behavioral acceptance degrades to skip"
          else
            echo "::error::RWX-EXEC unexpected exit $st (worker bug, not environment)"
            exit 1
          fi
      - name: Synthetic behavioral tests (auto-skip if blocked)
        run: swift test --filter VerifierTests
      - name: Real-dylib end-to-end (CLI verify, arm64 branch)
        if: steps.rwx.outputs.rwx == 'ok'
        env:
          BUILD: ${{ github.event.inputs.build || '270100' }}
        run: |
          set -euo pipefail
          case "$BUILD" in
            270100) V=4.1.15.20 ;; 270099) V=4.1.15.19 ;; 270098) V=4.1.15.18 ;;
            270097) V=4.1.15.17 ;; 270096) V=4.1.15.16 ;; 270095) V=4.1.15.15 ;;
            270094) V=4.1.15.14 ;; 270091) V=4.1.15.11 ;; 270090) V=4.1.15.10 ;;
            *) echo "::error::no CDN version mapping for $BUILD (add to the case map)"; exit 1 ;;
          esac
          URL="https://dldir1v6.qq.com/weixin/Universal/Mac/xWeChatMac_universal_${V}_${BUILD}.dmg"
          echo "downloading $URL"
          curl -fL --retry 3 -o /tmp/wx.dmg "$URL"
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/wxmnt /tmp/wx.dmg
          APP="$RUNNER_TEMP/WeChat_$BUILD.app"
          mkdir -p "$APP/Contents/Resources"
          cp /tmp/wxmnt/WeChat.app/Contents/Resources/wechat.dylib "$APP/Contents/Resources/"
          printf '<?xml version="1.0"?><plist version="1.0"><dict>\n  <key>CFBundleVersion</key><string>%s</string>\n</dict></plist>\n' "$BUILD" > "$APP/Contents/Info.plist"
          hdiutil detach /tmp/wxmnt
          # arm64 全链验收：catalog 定位 → MachImage 切片谓词反解（fat 装机
          # 形态）→ worker RWX 执行 → verdictPredicate 对照家族地面真值
          .build/release/wxkeep verify -a "$APP" -c config.json -s signatures.json
