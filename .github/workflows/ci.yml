name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    name: Swift ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show toolchain
        run: |
          swift --version
          sw_vers
      - name: "Guard - no private key material tracked"
        run: |
          match=$(git ls-files -z | xargs -0 grep -lI "BEGIN [A-Z ]*PRIVATE KEY" 2>/dev/null || true)
          if [ -n "$match" ]; then
            echo "::error::私有密钥材料被提交进仓库：$match"
            exit 1
          fi
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Ensure Rosetta (defensive; macos-15 images usually preinstall it)
        if: matrix.os == 'macos-15'
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
      - name: Test x86_64 under Rosetta
        if: matrix.os == 'macos-15'
        # GitHub 免费 CI 池只有 arm64 runner——x64 路径（mini-loader worker、
        # PLT/GOT 重定向、x64 SSO 探针）零覆盖，问题只能在用户 Intel 机上炸
        # 出来（269631 SIGSEGV 实测链）。Rosetta 下 worker 照常执行映射代码，
        # VerifierTests 的 x64 集成测试在这里跑的就是真 x64 worker 路径。
        run: arch -x86_64 swift test
      - name: Release build (universal smoke)
        if: matrix.os == 'macos-15'
        run: swift build -c release
      - name: CLI smoke
        if: matrix.os == 'macos-15'
        run: |
          .build/release/wxkeep --help
          .build/release/wxkeep versions || true   # no WeChat on runners: expect a clean error

  manifest-sign:
    name: Sign data manifest
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.repository != ''
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sign config/signatures manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "RELEASE_SIGNING_KEY secret 未配置——跳过签名（数据仍可用，doctor 报 legacy）"
            exit 0
          fi
          printf '%s' "$RELEASE_SIGNING_KEY" > /tmp/key.pem
          python3 -m venv /tmp/signenv
          /tmp/signenv/bin/pip install --quiet pynacl
          /tmp/signenv/bin/python tools/sign_manifest.py --key /tmp/key.pem
          rm -f /tmp/key.pem
          if [ -n "$(git status --porcelain manifest.json manifest.sig)" ]; then
            git config user.name "wxkeep-ci"
            git config user.email "actions@github.com"
            git add manifest.json manifest.sig
            git commit -m "chore(data): re-sign manifest [skip ci]"
            git push
          else
            echo "manifest 无变化"
          fi
