name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    name: Swift ${{ matrix.os }} / Xcode ${{ matrix.xcode }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 于 2026-11-02 退役（brownout 见 runner-images#13518）——
        # 老工具链腿改为 macos-15 + 钉旧 Xcode：本机 SDK 永远最新，CI 的
        # 价值在「旧 SDK 也得编译过」（withUnsafeMutableBytes 二义性教训），
        # 双代 SDK 矩阵不可丢。full=1 的腿额外跑 Rosetta x64/发布冒烟。
        include:
          - os: macos-15
            xcode: latest-stable
            full: "1"
          - os: macos-15
            xcode: "16.4"
            full: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Show toolchain
        run: |
          swift --version
          sw_vers
      - name: "Guard - no private key material tracked"
        run: |
          match=$(git ls-files -z | xargs -0 grep -lI "BEGIN [A-Z ]*PRIVATE KEY" 2>/dev/null || true)
          if [ -n "$match" ]; then
            echo "::error::私有密钥材料被提交进仓库：$match"
            exit 1
          fi
      - name: "Guard - mutation anchors canonical (no mutated source ever lands)"
        # 125 轮 V5 深度轮：mutation_test.py 就地改源码，SIGKILL 会泄漏变异态
        #（2026-11-03 本机实证）。CI 侧兜底：任一 MUTATIONS 锚点不在 canonical
        # 形 = 源文件处于变异态，立即红。与 pre-commit（make hooks）同判据。
        run: |
          python3 - <<'EOF'
          import os, sys
          sys.path.insert(0, os.path.join(os.getcwd(), "tools"))
          from mutation_test import MUTATIONS
          bad = []
          for mid, path, old, new, _d in MUTATIONS:
              s = open(path, encoding="utf-8").read()
              if s.count(old) != 1:
                  bad.append((mid, path, f"anchor 计数 {s.count(old)} != 1"))
              elif new in s:
                  bad.append((mid, path, "变异形态在盘"))
          if bad:
              for mid, path, why in bad:
                  print(f"::error file={path}::变异锚点 [{mid}] {why}——漂移或变异态（在场≠可跑）")
              sys.exit(1)
          print(f"✓ {len(MUTATIONS)} 个变异锚点全在 canonical 可跑态")
          EOF
      - name: "Manifest - independent openssl verify (Ed25519 signature gate)"
        # 125 轮证据链接线：CryptoKit 之外的独立验签（防共因）。**只硬门签名
        # 有效性**：manifest-sign job 在本腿之后才重签，master push 改 config 的
        # 合法窗口里哈希必然失配——哈希面按 WXKEEP_HASH_WARN=1 降为 warning
        #（双评审 P1：此前硬门会把重签流永久堵死）；签名对不上才红。
        if: github.ref == 'refs/heads/master'
        run: |
          OPENSSL_RUN() {
            if ! WXKEEP_HASH_WARN=1 bash tools/verify_manifest_openssl.sh; then
              echo "::warning::系统 openssl 不支持 Ed25519 pkeyutl，回退 brew openssl@3 重试"
              brew install -q openssl@3
              OPENSSL="$(brew --prefix openssl@3)/bin/openssl"                 WXKEEP_HASH_WARN=1 bash tools/verify_manifest_openssl.sh
            fi
          }
          OPENSSL_RUN
      - name: Build
        run: swift build
      - name: "Guard - runtime.m compiles for both arches"
        # 124 轮 P0 教训制度化：x86_64 编译损坏在本地多轮未推期间不可见
        # （CI Rosetta 腿要等 push 后才见代码）；clang -c 双架构秒级兜底，
        # 全 matrix 腿都跑（不等 full 腿的 Rosetta 测试）。
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          clang -c -arch arm64 -fobjc-arc -isysroot "$SDK" -I Sources/WxkeepRuntime/include Sources/WxkeepRuntime/runtime.m -o /tmp/rm-arm64.o
          clang -c -arch x86_64 -fobjc-arc -isysroot "$SDK" -I Sources/WxkeepRuntime/include Sources/WxkeepRuntime/runtime.m -o /tmp/rm-x64.o
      - name: Test
        run: swift test
      - name: Ensure Rosetta (defensive; macos-15 images usually preinstall it)
        if: matrix.full == '1'
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
      - name: Test x86_64 under Rosetta
        if: matrix.full == '1'
        # GitHub 免费 CI 池只有 arm64 runner——x64 路径（mini-loader worker、
        # PLT/GOT 重定向、x64 SSO 探针）零覆盖，问题只能在用户 Intel 机上炸
        # 出来（269631 SIGSEGV 实测链）。Rosetta 下 worker 照常执行映射代码，
        # VerifierTests 的 x64 集成测试在这里跑的就是真 x64 worker 路径。
        run: arch -x86_64 swift test
      - name: Release build (universal smoke)
        if: matrix.full == '1'
        run: swift build -c release
      - name: CLI smoke
        if: matrix.full == '1'
        run: |
          .build/release/wxkeep --help
          .build/release/wxkeep versions || true   # no WeChat on runners: expect a clean error

  manifest-sign:
    name: Sign data manifest
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.repository != ''
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sign config/signatures manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "RELEASE_SIGNING_KEY secret 未配置——跳过签名（数据仍可用，doctor 报 legacy）"
            exit 0
          fi
          printf '%s' "$RELEASE_SIGNING_KEY" > /tmp/key.pem
          python3 -m venv /tmp/signenv
          /tmp/signenv/bin/pip install --quiet pynacl
          /tmp/signenv/bin/python tools/sign_manifest.py --key /tmp/key.pem
          rm -f /tmp/key.pem
          if [ -n "$(git status --porcelain manifest.json manifest.sig)" ]; then
            git config user.name "wxkeep-ci"
            git config user.email "actions@github.com"
            git add manifest.json manifest.sig
            git commit -m "chore(data): re-sign manifest [skip ci]"
            # 与人工 push 竞态防护（270350 合入日实测：人工提交落在签名窗
            # 内 → fetch first 拒推 → 签名提交丢失）。重试三次 rebase 拉
            # 平后重推；仍败则报错退出（下次 CI 会再签）。
            for i in 1 2 3; do
              git pull --rebase --autostash origin master && git push && break
              [ "$i" = 3 ] && exit 1
              sleep 15
            done
          else
            echo "manifest 无变化"
          fi
