name: backfill-expected

# 为隔离区条目（缺 expected 溯源字节）回填官方归档字节。**仅手动触发**：
# 剩余 78 条隔离全部为 4.1.12 及更老时代构建——官方 CDN 无归档（全线 404），
# zsbai 老线资产系统性源头损坏（digest 级实证，docs/ROADMAP ㉛）——回填源为
# 永久缺口。曾挂每日排程：只会反复下载已知损坏文件空跑，且因 no-op 轮也
# 无条件重写 config（indent 与仓库不一致 → 整文件 diff → commit+push）而
# 天天红（2026-09-22 收口，见 ROADMAP ㊴）。新第三方存档出现时手动
# dispatch；4.1.13+ 新构建走 watch-wechat / CDN 派生，不依赖本流水线。
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "本次处理的构建号数"
        default: "5"

jobs:
  backfill:
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Count quarantined entries
        id: count
        run: |
          n=$(python3 tools/count_quarantined.py)
          echo "quarantined=$n" >> "$GITHUB_OUTPUT"
          echo "隔离条目: $n"
      - name: Backfill
        if: steps.count.outputs.quarantined != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '5' }}"
          python3 tools/backfill_expected.py --config config.json --limit "$LIMIT"
          # 重新生成矩阵（隔离标记随之更新）
          python3 tools/gen_matrix.py || true
          if [ -n "$(git status --porcelain config.json docs/COMPATIBILITY.md)" ]; then
            git config user.name "wxkeep-bot"
            git config user.email "actions@users.noreply.github.com"
            git add config.json docs/COMPATIBILITY.md
            rm -f config.json.bak.*
            git commit -m "backfill: expected bytes from official archives (auto)"
            git push
          else
            echo "无变化（下载源缺失或已全部回填）"
          fi
      - name: Remaining
        if: steps.count.outputs.quarantined != '0'
        run: |
          echo "剩余隔离: $(python3 tools/count_quarantined.py)（有新归档源时再次 dispatch）"
