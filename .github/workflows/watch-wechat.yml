name: watch-wechat

# 每日巡检官方新版本 → 自动跑定位配方 → 命中则自动开 PR（config 条目 + 矩阵），
# 未命中/失败开 issue 供人工分析。expected 门在合入后仍兜底：定位只是选地址，
# 写入前的字节校验才会放行；行为验证需 SIP-off 实机 → 标注 manual-verify-needed。
#
# 2026-09 升级：不再只看 zsbai 的 latest release（每日一查会漏同日多发的子构建，
# 4.1.15 段实测漏了 .11/.13/.15/.16/.18）——改为拉取最近 15 个 release，把所有
# 高于本仓 known 的构建一次性追完；每个构建用其归档 asset dmg 下载（构建号↔dmg
# 精确对应，不再依赖官网首页的「当前版」直链）。
on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC（zsbai 归档流水线之后）
  workflow_dispatch:

jobs:
  watch:
    runs-on: macos-15
    permissions:
      issues: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Collect new archived builds
        id: latest
        run: |
          set -euo pipefail
          # zsbai/wechat-versions 的每个 release body 带 DestVersion（构建号），
          # release asset 是当日归档的官方 dmg——构建号与安装包一一对应。
          curl -sf "https://api.github.com/repos/zsbai/wechat-versions/releases?per_page=15" \
            -o /tmp/zsbai_releases.json || true
          python3 tools/watch_new_builds.py /tmp/zsbai_releases.json config.json > /tmp/new_builds.txt
          if [ -s /tmp/new_builds.txt ]; then
            echo "new builds:"; cat /tmp/new_builds.txt
            echo "need_report=yes" >> "$GITHUB_OUTPUT"
          else
            known=$(python3 -c "import json; d=json.load(open('config.json')); print(max(int(v['version']) for v in d))")
            echo "无高于 known=$known 的归档构建——本轮跳过"
            echo "need_report=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Download & locate each new build
        if: steps.latest.outputs.need_report == 'yes'
        run: |
          set -euo pipefail
          swift build -c release
          : > /tmp/report.md
          while read -r BUILD DMG_URL; do
            [ -n "$BUILD" ] || continue
            echo "## 新微信构建 $BUILD — 自动定位结果" >> /tmp/report.md
            if [ -z "$DMG_URL" ]; then
              echo "- 归档 release 无 dmg asset——无法自动定位，转人工（官网/CDN 直链下载后跑 wxkeep locate）" >> /tmp/report.md
              echo "  （版本化直链规律：https://dldir1v6.qq.com/weixin/Universal/Mac/xWeChatMac_universal_<版本>_<构建>.dmg）" >> /tmp/report.md
              continue
            fi
            echo "构建 $BUILD — 下载归档 dmg 并提取 dylib"
            curl -sfL -o /tmp/wx.dmg "$DMG_URL"
            hdiutil attach -nobrowse -readonly -mountpoint /tmp/wxmount /tmp/wx.dmg
            cp /tmp/wxmount/WeChat.app/Contents/Resources/wechat.dylib /tmp/wechat.dylib
            hdiutil detach /tmp/wxmount >/dev/null
            echo "slice sha256: $(shasum -a 256 /tmp/wechat.dylib | cut -d' ' -f1)" >> /tmp/report.md
            # 构建工具并对提取的 dylib 跑全部配方（--app 期望 bundle：造一个假壳）
            rm -rf /tmp/fake/WeChat.app && mkdir -p /tmp/fake/WeChat.app/Contents/Resources
            cp /tmp/wechat.dylib /tmp/fake/WeChat.app/Contents/Resources/
            plutil -create xml1 /tmp/fake/WeChat.app/Contents/Info.plist
            plutil -insert CFBundleVersion -string "$BUILD" /tmp/fake/WeChat.app/Contents/Info.plist
            {
              echo '```'
              .build/release/wxkeep locate -a /tmp/fake/WeChat.app || true
              echo '```'
              # --append 直接把命中的配方条目并进 config（内部自带备份与去重）
              .build/release/wxkeep locate -a /tmp/fake/WeChat.app --append \
                --config config.json --signatures signatures.json || true
              echo "- 注意：行为验证（verify）需要 SIP-off 实机 → manual-verify-needed"
              echo "- expected 门兜底：即使本 PR 合入，写入前字节校验不过则拒绝打补丁"
            } >> /tmp/report.md
          done < /tmp/new_builds.txt
          cat /tmp/report.md
      - name: Auto-PR with derived entries
        if: steps.latest.outputs.need_report == 'yes'
        id: pr
        run: |
          set -euo pipefail
          python3 tools/gen_matrix.py
          if [ -z "$(git status --porcelain config.json docs/COMPATIBILITY.md)" ]; then
            echo "无新条目（配方未命中，新签名代）→ 转 issue 走人工分析"
            echo "opened=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BUILDS=$(awk '{printf "%s ", $1}' /tmp/new_builds.txt | xargs)
          git config user.name "wxkeep-bot"
          git config user.email "actions@github.com"
          branch="auto/builds-$(echo "$BUILDS" | tr ' ' '-')"
          git checkout -b "$branch"
          git add config.json docs/COMPATIBILITY.md
          git commit -m "auto: locate entries for builds $BUILDS (recipe-derived, manual review needed)"
          git push origin "$branch"
          echo "opened=yes" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "builds=$BUILDS" >> "$GITHUB_OUTPUT"
      - name: Open PR
        if: steps.latest.outputs.need_report == 'yes' && steps.pr.outputs.opened == 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/report.md', 'utf-8');
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: context.ref.replace('refs/heads/', ''),
              head: '${{ steps.pr.outputs.branch }}',
              title: `适配新微信构建 ${{ steps.pr.outputs.builds }}（自动定位，待审核）`,
              body: body + '\n\n合并前请：核对 expected 字节与构建号；实机行为验证后移除 manual-verify-needed。'
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: pr.data.number,
              labels: ['auto-locate', 'manual-verify-needed']
            });
      - name: Fallback tracking issue (no entries / PR failed)
        if: steps.latest.outputs.need_report == 'yes' && steps.pr.outputs.opened != 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/report.md', 'utf-8');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `适配新微信构建（自动定位报告 ${{ steps.pr.outputs.builds || '见正文' }}）`,
              labels: ['auto-locate', 'manual-verify-needed'],
              body
            });
