name: watch-wechat

# 每日巡检官方新版本 → 自动跑定位配方 → 命中则自动开 PR（config 条目 + 矩阵），
# 未命中/失败开 issue 供人工分析。expected 门在合入后仍兜底：定位只是选地址，
# 写入前的字节校验才会放行；行为验证需 SIP-off 实机 → 标注 manual-verify-needed。
on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC（zsbai 归档流水线之后）
  workflow_dispatch:

jobs:
  watch:
    runs-on: macos-15
    permissions:
      issues: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest archived build
        id: latest
        run: |
          set -euo pipefail
          # zsbai/wechat-versions 的 release body 带 DestVersion（构建号）
          resp=$(curl -sf https://api.github.com/repos/zsbai/wechat-versions/releases/latest || true)
          # set -e + grep 空匹配返回 1 会杀掉本 step —— 每一环都容错，取不到就是"无信息"而非失败
          latest_build=$(python3 -c "import json,sys; d=json.loads(sys.stdin.read()); print(d.get('body',''))" <<<"$resp" \
            | grep -io 'DestVersion[^0-9]*[0-9][0-9]*' | head -1 | grep -o '[0-9][0-9]*' || true)
          known=$(python3 -c "import json; d=json.load(open('config.json')); print(max(int(v['version']) for v in d))")
          if [ -z "$latest_build" ]; then
            echo "归档源未返回 DestVersion（接口变动或限流）——本轮跳过，不算失败"
            echo "need_report=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "latest=$latest_build known=$known"
          echo "latest=$latest_build" >> "$GITHUB_OUTPUT"
          echo "known=$known" >> "$GITHUB_OUTPUT"
          # Numeric compare HERE: GitHub `if:` compares strings, and lexicographic
          # order diverges from numeric when build numbers change digit count.
          need=no
          if [ -n "$latest_build" ] && [ "$latest_build" -gt "$known" ] 2>/dev/null; then need=yes; fi
          echo "need_report=$need" >> "$GITHUB_OUTPUT"
      - name: New build? download & locate
        if: steps.latest.outputs.need_report == 'yes'
        run: |
          set -euo pipefail
          BUILD="${{ steps.latest.outputs.latest }}"
          echo "新构建 $BUILD — 下载官方 dmg 并提取 dylib"
          dmg_url=$(curl -sf "https://mac.weixin.qq.com/?t=mac&lang=zh_CN" \
            | grep -o 'https://[^"]*\.dmg' | head -1)
          if [ -z "$dmg_url" ]; then echo "::warning::官网未取到 dmg 直链"; exit 0; fi
          curl -sfL -o /tmp/wx.dmg "$dmg_url"
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/wxmount /tmp/wx.dmg
          cp /tmp/wxmount/WeChat.app/Contents/Resources/wechat.dylib /tmp/wechat.dylib
          hdiutil detach /tmp/wxmount >/dev/null
          echo "slice sha256:"
          shasum -a 256 /tmp/wechat.dylib
          # 构建工具并对提取的 dylib 跑全部配方（--app 期望 bundle：造一个假壳）
          mkdir -p /tmp/fake/WeChat.app/Contents/Resources
          cp /tmp/wechat.dylib /tmp/fake/WeChat.app/Contents/Resources/
          plutil -create xml1 /tmp/fake/WeChat.app/Contents/Info.plist
          plutil -insert CFBundleVersion -string "$BUILD" /tmp/fake/WeChat.app/Contents/Info.plist
          swift build -c release
          {
            echo "## 新微信构建 $BUILD — 自动定位结果"
            echo '```'
            .build/release/wxkeep locate -a /tmp/fake/WeChat.app || true
            echo '```'
            echo "- dylib sha256: $(shasum -a 256 /tmp/wechat.dylib | cut -d" " -f1)"
            echo "- 注意：行为验证（verify）需要 SIP-off 实机 → manual-verify-needed"
            echo "- expected 门兜底：即使本 PR 合入，写入前字节校验不过则拒绝打补丁"
          } > /tmp/report.md
          cat /tmp/report.md
      - name: Auto-PR with derived entries
        if: steps.latest.outputs.need_report == 'yes'
        id: pr
        run: |
          set -euo pipefail
          BUILD="${{ steps.latest.outputs.latest }}"
          # --append 直接把命中的配方条目并进 config（内部自带备份与去重）
          .build/release/wxkeep locate -a /tmp/fake/WeChat.app --append \
            --config config.json --signatures signatures.json || true
          python3 tools/gen_matrix.py
          if [ -z "$(git status --porcelain config.json docs/COMPATIBILITY.md)" ]; then
            echo "无新条目（配方未命中，新签名代）→ 转 issue 走人工分析"
            echo "opened=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "wxkeep-bot"
          git config user.email "actions@github.com"
          branch="auto/build-$BUILD"
          git checkout -b "$branch"
          git add config.json docs/COMPATIBILITY.md
          git commit -m "auto: locate entries for build $BUILD (recipe-derived, manual review needed)"
          git push origin "$branch"
          echo "opened=yes" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Open PR
        if: steps.latest.outputs.need_report == 'yes' && steps.pr.outputs.opened == 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/report.md', 'utf8');
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: context.ref.replace('refs/heads/', ''),
              head: '${{ steps.pr.outputs.branch }}',
              title: `适配新微信构建 ${{ steps.latest.outputs.latest }}（自动定位，待审核）`,
              body: body + '\n\n合并前请：核对 expected 字节与构建号；实机行为验证后移除 manual-verify-needed。'
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: pr.data.number,
              labels: ['auto-locate', 'manual-verify-needed']
            });
      - name: Fallback tracking issue (no entries / PR failed)
        if: steps.latest.outputs.need_report == 'yes' && steps.pr.outputs.opened != 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/report.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `适配新微信构建 ${{ steps.latest.outputs.latest }}（自动定位报告）`,
              labels: ['auto-locate', 'manual-verify-needed'],
              body
            });
