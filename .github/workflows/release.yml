name: release

# 打 tag (v*) 自动产出 universal 单文件并挂到 GitHub Release。
# Runner 带完整 Xcode → 可交叉编译双架构（本机 CLT 做不到）。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal binaries (CLI + runtime dylib)
        run: |
          swift build -c release --arch arm64 --arch x86_64
          # 交叉构建产物在 .build/apple/Products/Release/，非 .build/release/
          BIN=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/wxkeep
          DYLIB=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/libwxkeep_runtime.dylib
          echo "binary: $BIN"
          echo "dylib:  $DYLIB"
          strip -x "$BIN"
          codesign -f -s - "$BIN"
          codesign -f -s - "$DYLIB"
          "$BIN" --version
          lipo -info "$BIN" "$DYLIB"
          test -f "$DYLIB"
          ls -lh "$BIN" "$DYLIB"
      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          DIR=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)
          gh release create "$tag" --generate-notes --verify-tag || true
          gh release upload "$tag" "$DIR/wxkeep#wxkeep" --clobber
          gh release upload "$tag" "$DIR/libwxkeep_runtime.dylib#libwxkeep_runtime.dylib" --clobber
          echo "产物已挂到 https://github.com/${GITHUB_REPOSITORY}/releases/tag/$tag"

